[project]
name = "markdown-editor"
version = "1.0.0"
description = "Markdown Editor - Python Backend + React Frontend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.20",
    "markdown>=3.7",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
pdf = [
    "weasyprint>=63.0",
]

[project.scripts]
dev = "uvicorn backend.app.main:app --reload"

[tool.ruff]
line-length = 100
target-version = "py312"

lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

lint.ignore = [
    "E501",   # line-too-long
    "RUF003", # ambiguous-unicode-character-comment (日本語コメントで全角括弧を許容)
    "B008",   # function-call-in-default-argument (FastAPIのDepends()パターンを許容)
]

lint.fixable = ["ALL"]
lint.unfixable = []

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    "node_modules",
    "frontend/dist",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
