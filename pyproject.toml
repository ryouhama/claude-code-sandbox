[project]
name = "claude-code-sandbox"
version = "0.1.0"
description = "A sandbox project for experimenting with Claude Code and Python development workflows"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
# Ruffの基本設定
line-length = 100
target-version = "py312"

# 有効にするルール
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

# 無視するルール
lint.ignore = [
    "E501", # line-too-long (formatterが対応)
]

# 自動修正を有効化
lint.fixable = ["ALL"]
lint.unfixable = []

# 除外するディレクトリ
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
]

[tool.ruff.format]
# フォーマッターの設定
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
# mypyの基本設定
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# 段階的に型チェックを厳格化する場合はコメントアウト
# disallow_untyped_defs = false
# disallow_incomplete_defs = false
